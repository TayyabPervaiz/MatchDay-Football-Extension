<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay - Football Fixtures &amp; Scores</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- API Key Setup Overlay -->
  <div id="apiKeyOverlay" class="overlay hidden" role="dialog" aria-labelledby="apiKeyHeading" aria-modal="true">
    <div class="overlay-content">
      <div class="overlay-icon" aria-hidden="true">&#x26BD;</div>
      <h2 id="apiKeyHeading">Welcome to <span>MatchDay</span></h2>
      <p id="apiKeyDesc">Choose your football data provider and enter your API key to get live fixtures</p>

      <div class="setup-provider-toggle" role="group" aria-label="API Provider">
        <button type="button" class="setup-provider-btn active" id="setupProviderOpenFoot" data-provider="openfoot">OpenFootAPI</button>
        <button type="button" class="setup-provider-btn" id="setupProviderFD" data-provider="football_data">Football-Data.org</button>
      </div>

      <input type="text" id="apiKeyInput" placeholder="Paste your OpenFootAPI key..." autocomplete="off" aria-label="API key" />
      <p id="apiKeyError" style="color:#ff6b6b;font-size:12px;margin:6px 0 0;min-height:16px;"></p>
      <button id="saveApiKey" class="btn-primary">Save &amp; Start</button>
      <a id="setupApiKeyLink" href="https://openfootapi.com" target="_blank" rel="noopener noreferrer" class="link-subtle">Get a free OpenFootAPI key here &#x2192;</a>
    </div>
  </div>

  <!-- Main App -->
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon" aria-hidden="true">&#x26BD;</span>
          <span class="logo-text">Match<span>Day</span></span>
        </div>
      </div>
      <div class="header-right">
        <button id="refreshBtn" class="icon-btn" title="Refresh matches" aria-label="Refresh matches">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav" role="tablist" aria-label="Main navigation">
      <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="matchesTab" id="tab-matches" data-tab="matches">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Matches</span>
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="leaguesTab" id="tab-leagues" data-tab="leagues">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span>Leagues</span>
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="followingTab" id="tab-following" data-tab="following">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span>Following</span>
      </button>
      <div class="tab-indicator" aria-hidden="true"></div>
    </nav>

    <!-- Date Segmented Control (Matches tab only) -->
    <div id="dateFilter" class="date-filter segmented-control" role="group" aria-label="Date range filter">
      <button class="date-btn" role="button" aria-pressed="false" data-range="yesterday">Yesterday</button>
      <button class="date-btn active" role="button" aria-pressed="true" data-range="today">Today</button>
      <button class="date-btn" role="button" aria-pressed="false" data-range="tomorrow">Tomorrow</button>
      <button class="date-btn" role="button" aria-pressed="false" data-range="week">This Week</button>
    </div>

    <!-- Content Area -->
    <main class="content">
      <!-- Matches Tab -->
      <div id="matchesTab" class="tab-content active" role="tabpanel" aria-labelledby="tab-matches">
        <!-- Sub-filter bar (All, Live, My Teams) -->
        <div id="matchSubFilters" class="filter-bar" role="group" aria-label="Match status filter">
          <button class="filter-chip active" data-filter="all" id="filterAll" aria-pressed="true">All Matches</button>
          <button class="filter-chip live-chip dim-when-zero" data-filter="live" id="filterLive" aria-pressed="false" title="Filter live matches">
            <span class="live-dot-mini" aria-hidden="true"></span>Live<span id="liveBadgeCount" class="chip-count hidden">0</span>
          </button>
          <button class="filter-chip" data-filter="followed" id="filterFollowed" aria-pressed="false">&#x2B50; My Teams</button>
        </div>

        <div id="matchesList" class="matches-list" role="feed" aria-live="polite">
          <!-- Skeleton loaders -->
          <div class="skeleton-group" aria-hidden="true">
            <div class="skeleton skeleton-header"></div>
            <div class="skeleton-card"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
          </div>
        </div>
      </div>

      <!-- Leagues Tab -->
      <div id="leaguesTab" class="tab-content" role="tabpanel" aria-labelledby="tab-leagues">
        <div class="leagues-header-info">
          <p>Select the competitions you want to track in MatchDay.</p>
        </div>
        <div class="leagues-grid" id="leaguesGrid"></div>
      </div>

      <!-- Following Tab -->
      <div id="followingTab" class="tab-content" role="tabpanel" aria-labelledby="tab-following">
        <div class="search-bar" role="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="teamSearch" placeholder="Search teams to follow..." autocomplete="off" aria-label="Search teams to follow" />
        </div>
        <div id="followedTeams" class="followed-teams"></div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar" role="contentinfo">
      <span id="statusText">Loading...</span>
      <span id="lastUpdated"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
